kind = "mobile"
previewPath = "/mobile/"
title = "Fnashha Mobile (Expo Prototype)"
version = "1.0.0"
id = "artifacts/fnashha-expo"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 19571

[services.development]
run = "pnpm --filter @workspace/fnashha-expo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fnashha-expo", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fnashha-expo", "run", "serve" ]

[services.env]
PORT = "19571"
BASE_PATH = "/mobile/"
