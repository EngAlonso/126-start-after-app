# ============================================================
# Fnashha — Nginx Reverse Proxy Configuration Example
# ============================================================
#
# USAGE
# -----
# 1. Copy to /etc/nginx/sites-available/fnashha
# 2. Replace "fnashha.com" with your actual domain.
# 3. Obtain a TLS certificate (e.g. via Certbot/Let's Encrypt):
#      certbot --nginx -d fnashha.com -d www.fnashha.com
# 4. Enable: ln -s /etc/nginx/sites-available/fnashha /etc/nginx/sites-enabled/
# 5. Test:   nginx -t
# 6. Reload: systemctl reload nginx
#
# ARCHITECTURE
# ------------
#   Browser / Flutter app
#       │
#       ▼
#   Nginx :443 (TLS termination)
#       ├─ /api/*     → Express API server  (localhost:8080)
#       ├─ /uploads/* → Express API server  (localhost:8080, serves local files)
#       └─ /*         → Static frontend     (artifacts/fnashha/dist/public/)
#
# The API server and the frontend static files can be on the same machine
# (recommended for simplicity) or split across two servers.
#
# SSE (Server-Sent Events)
# ------------------------
# /api/events and /api/admin/events use long-lived HTTP connections.
# The proxy_buffering, proxy_cache, and timeout settings below are
# required for SSE to work through Nginx.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fnashha.com www.fnashha.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name fnashha.com www.fnashha.com;

    # ── TLS (Certbot will fill these in automatically) ───────────────────────
    # ssl_certificate     /etc/letsencrypt/live/fnashha.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fnashha.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"            always;
    add_header X-Content-Type-Options   "nosniff"               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=()" always;
    # Uncomment after verifying HSTS won't lock you out:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Upload size limit ────────────────────────────────────────────────────
    # Must match (or exceed) the limit set in app.ts (20 MB) and multer (100 MB).
    client_max_body_size 110M;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ── API + local file uploads → Express ───────────────────────────────────
    location ~ ^/(api|uploads)(/|$) {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard proxy headers so Express sees the real client IP and
        # protocol. Required for rate-limiting (trust proxy = 1 in app.ts)
        # and for HTTPS-aware redirect URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE (Server-Sent Events) specific ────────────────────────────────
        # Disable buffering so SSE events flow to the client immediately.
        # The Express routes already send "X-Accel-Buffering: no" but this
        # location block also sets it explicitly for clarity.
        proxy_buffering    off;
        proxy_cache        off;

        # SSE connections are long-lived (hours). Set generous timeouts so
        # Nginx does not close idle SSE connections.  The Express side sends a
        # ":ping" comment every 25 s, keeping connections alive within these
        # windows.
        proxy_read_timeout  3600s; # 1 hour — covers idle SSE connections
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Required for WebSocket upgrade headers (not used today but
        # future-proofs the config if WebSockets are added later).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Frontend static files ─────────────────────────────────────────────────
    # Point this at the output of `pnpm --filter @workspace/fnashha run build`.
    root /var/fnashha/app/artifacts/fnashha/dist/public;
    index index.html;

    # Dynamic SEO pages are emitted as directories only for eligible
    # service/location combinations. Do not send an unavailable combination
    # through the SPA fallback, or crawlers will receive a soft 404.
    location ~ ^/services/[^/]+/[^/]+/?$ {
        try_files $uri $uri/ =404;
    }

    location / {
        # Try the exact file, then the URI as a directory, then fall back to
        # index.html for the React SPA router.
        try_files $uri $uri/ /index.html;

        # Cache immutable hashed assets aggressively; let the browser re-check
        # everything else every hour.
        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|webp|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Native deep-link association files ───────────────────────────────────
    # The iOS file is extensionless, so set its required JSON content type
    # explicitly instead of relying on the server's extension map.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # ── PWA service worker — must never be cached ────────────────────────────
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
        try_files  $uri =404;
    }

    # ── Access and error logs ─────────────────────────────────────────────────
    access_log /var/log/nginx/fnashha_access.log;
    error_log  /var/log/nginx/fnashha_error.log warn;
}
